[project]
name = "rag-from-scratch"
version = "0.2.0"
description = "A RAG (retrieval-augmented generation) pipeline built from scratch: llama.cpp, TinyLlama, fixed-size chunking, cosine similarity, a cache and a CLI"
readme = "README.md"
authors = [
    { name = "NuhaKamal", email = "76655580+NuhaKamal@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.65.0",
    "huggingface-hub>=2.2.0",
    "llama-cpp-python>=0.3.36",
    "pypdf>=6.20.0",
    "torch>=2.14.1",
]

[project.scripts]
rag = "rag_from_scratch.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]